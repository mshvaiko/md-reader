[package]
name = "md-reader"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "md-reader"
path = "src/main.rs"

[dependencies]
# egui_commonmark 0.23 requires egui/eframe ^0.34
eframe  = { version = "0.34", features = ["persistence"] }
egui    = "0.34"
egui_commonmark = { version = "0.23", features = ["better_syntax_highlighting"] }
egui_extras = { version = "0.34", features = ["image", "file"] }
image   = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd     = "0.15"
notify  = "6"
serde   = { version = "1", features = ["derive"] }
piper-rs = "0.2.0"
rodio = { version = "0.22", default-features = false, features = ["playback"] }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
